<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Материалы — TutorHelp</title>

    <link rel="stylesheet" href="../theme/theme.css">
    <link rel="stylesheet" href="materials.css">
</head>

<body>

    <main class="materials-page">

        <a href="../index.html" class="materials-back">
            ← Назад к панели
        </a>


        <!-- HEADER -->

        <header class="materials-header">

            <div>
                <p class="materials-label">
                    TUTORHELP
                </p>

                <h1>
                    Материалы
                </h1>

                <p class="materials-description">
                    Библиотека учебных материалов для преподавателей.
                </p>
            </div>

            <button
                class="materials-add-button"
                id="addMaterialBtn"
            >
                + Добавить материал
            </button>

        </header>


        <!-- TOOLBAR -->

        <section class="materials-toolbar">

            <input
                type="search"
                id="materialsSearch"
                placeholder="Поиск материалов..."
            >

        </section>


        <!-- CATEGORIES -->

        <nav
            class="materials-categories"
            aria-label="Категории материалов"
        >

            <button
                class="category-button active"
                data-category="all"
            >
                Все
            </button>

            <button
                class="category-button"
                data-category="Учебник"
            >
                Учебники
            </button>

            <button
                class="category-button"
                data-category="Конспект"
            >
                Конспекты
            </button>

            <button
                class="category-button"
                data-category="Тест"
            >
                Тесты
            </button>

            <button
                class="category-button"
                data-category="Аудио"
            >
                Аудио
            </button>

            <button
                class="category-button"
                data-category="Видео"
            >
                Видео
            </button>

        </nav>


        <!-- MATERIALS -->

        <section class="materials-section">

            <div class="materials-section-header">

                <div>
                    <h2>
                        Библиотека
                    </h2>

                    <p id="materialsCount">
                        0 материалов
                    </p>
                </div>

            </div>


            <div
                class="materials-grid"
                id="materialsGrid"
            >
            </div>


            <div
                class="materials-empty hidden"
                id="materialsEmpty"
            >
                <h3>
                    Материалы не найдены
                </h3>

                <p>
                    Попробуйте изменить поиск или выбрать другую категорию.
                </p>
            </div>

        </section>


        <!-- ADD MATERIAL MODAL -->

        <div
            class="modal-overlay hidden"
            id="materialModal"
        >

            <div
                class="material-modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="materialModalTitle"
            >

                <div class="material-modal-header">

                    <div>
                        <p class="materials-label">
                            БИБЛИОТЕКА
                        </p>

                        <h2 id="materialModalTitle">
                            Добавить материал
                        </h2>
                    </div>

                    <button
                        class="modal-close"
                        id="closeMaterialModal"
                        type="button"
                        aria-label="Закрыть"
                    >
                        ×
                    </button>

                </div>


                <form id="materialForm">

                    <div class="form-field">

                        <label for="materialTitle">
                            Название
                        </label>

                        <input
                            id="materialTitle"
                            name="title"
                            type="text"
                            placeholder="Например: Present Simple"
                            required
                        >

                    </div>


                    <div class="form-row">

                        <div class="form-field">

                            <label for="materialType">
                                Тип
                            </label>

                            <select
                                id="materialType"
                                name="type"
                                required
                            >

                                <option value="">
                                    Выберите тип
                                </option>

                                <option value="Учебник">
                                    Учебник
                                </option>

                                <option value="Конспект">
                                    Конспект
                                </option>

                                <option value="Тест">
                                    Тест
                                </option>

                                <option value="Аудио">
                                    Аудио
                                </option>

                                <option value="Видео">
                                    Видео
                                </option>

                            </select>

                        </div>


                        <div class="form-field">

                            <label for="materialLevel">
                                Уровень
                            </label>

                            <select
                                id="materialLevel"
                                name="level"
                            >

                                <option value="">
                                    Не указан
                                </option>

                                <option value="A1">
                                    A1
                                </option>

                                <option value="A2">
                                    A2
                                </option>

                                <option value="B1">
                                    B1
                                </option>

                                <option value="B2">
                                    B2
                                </option>

                                <option value="C1">
                                    C1
                                </option>

                                <option value="C2">
                                    C2
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="form-field">

                        <label for="materialSubject">
                            Предмет
                        </label>

                        <input
                            id="materialSubject"
                            name="subject"
                            type="text"
                            placeholder="Например: Английский язык"
                        >

                    </div>


                    <div class="form-field">

                        <label for="materialDescription">
                            Описание
                        </label>

                        <textarea
                            id="materialDescription"
                            name="description"
                            rows="4"
                            placeholder="Кратко опишите материал..."
                        ></textarea>

                    </div>


                    <div class="form-field">

                        <label for="materialFile">
                            Файл
                        </label>

                        <input
                            id="materialFile"
                            name="file"
                            type="file"
                            accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.mp3,.mp4"
                        >

                        <p class="field-hint">
                            PDF, DOC, DOCX, PPT, PPTX, XLS, XLSX, TXT, MP3, MP4
                        </p>

                    </div>


                    <div class="material-modal-actions">

                        <button
                            type="button"
                            class="modal-secondary-button"
                            id="cancelMaterialBtn"
                        >
                            Отмена
                        </button>

                        <button
                            type="submit"
                            class="modal-primary-button"
                        >
                            Добавить материал
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>
